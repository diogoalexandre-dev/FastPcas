body::after {
  content: "";
  position: fixed;
  z-index: -1;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  opacity: 0.1;
  background: 
    radial-gradient(ellipse 66% 42% at 78% 18%, var(--destaque-alt) 0%, transparent 80%),
    radial-gradient(ellipse 38% 58% at 16% 87%, var(--destaque) 0%, transparent 86%),
    radial-gradient(ellipse 58% 33% at 54% 61%, #fff7a1bb 0%, transparent 89%);
  filter: blur(1.6px) saturate(1.12);
  animation: newLiquidBackgroundMove s ease-in-out infinite alternate;
  transition: opacity 0,1s;
}
@keyframes dynamicFadeInUp {
  0% {
    opacity: 0;
    transform: translateY(48px) scale(0.93) skewY(2deg);
    filter: blur(9px);
  }
  20% {
    opacity: 0.;
    transform: translateY(13px) scale(1.02) skewY(-1deg);
    filter: blur(3px);
  }
  70% {
    opacity: 1;
    transform: translateY(-6px) scale(1.01);
    filter: blur(0.3px);
  }
  100% {
    opacity: 1;
    transform: none;
    filter: none;
  }
}
body > .container,
body > main,
body > header,
body > .main,
body > .principal,
body > .conteudo,
.resultado,
form,
h1, h2 {
  animation: dynamicFadeInUp 
  
  3s cubic-bezier(0.36,1.28,0.23,1.03) both;
  animation-delay: 1s;
}

h1 {
  animation-delay: 1s;
}
h2 {
  animation-delay: 1s;
}
form {
  animation-delay: 1s;
}
.resultado {
  animation-delay: 1s;
}
body > .container {
  animation-delay: 1s;
}

body::before {
  content: '';
  position: fixed;
  z-index: -2;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  opacity: 0.72;
  background:
    radial-gradient(ellipse 44% 60% at 82% 15%, #ffa72655 0%, transparent 82%),
    radial-gradient(ellipse 41% 31% at 20% 89%, #ffc10788 0%, transparent 89%),
    radial-gradient(ellipse 72% 23% at 60% 87%, #ffe08266 0%, transparent 93%);
  filter: blur(5.2px) saturate(1.17) brightness(1.04);
  animation: liquidFlowMove 16s ease-in-out infinite alternate;
  transition: opacity 1s, filter 1s;
}

@keyframes liquidFlowMove {
  0% {
    background-position: 84% 10%, 13% 84%, 63% 90%;
    filter: blur(5px) saturate(1.13) brightness(1.02);
  }
  21% {
    background-position: 76% 17%, 19% 88%, 51% 94%;
    filter: blur(8px) saturate(1.18) brightness(1.03);
  }
  56% {
    background-position: 89% 21%, 8% 74%, 67% 81%;
    filter: blur(6px) saturate(1.21) brightness(1.06);
  }
  79% {
    background-position: 78% 29%, 11% 91%, 63% 95%;
    filter: blur(7.5px) saturate(1.16) brightness(1.01);
  }
  100% {
    background-position: 84% 11%, 13% 82%, 60% 91%;
    filter: blur(5.2px) saturate(1.10) brightness(1.04);
  }
}

@keyframes sparkleMove {
  to {
    transform: translateY(-60px) scale(1.2) rotate(130deg);
    opacity: 0;
    filter: blur(5px) brightness(1.6);
  }
}
.sparkle-particles {
  pointer-events: none;
  position: fixed;
  z-index: 1100;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  mix-blend-mode: lighten;
}
.sparkle-particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0.75;
  animation: sparkleMove linear forwards;
  filter: blur(1px) brightness(1.2);
  will-change: transform, opacity, filter;
}
.sparkle-particle:nth-child(1) { left: 17vw; top: 13vh; width: 18px; height: 18px; background: radial-gradient(circle, #ffd34d, #ffa700 44%, transparent 80%); animation-duration: 3.2s; animation-delay: 0.8s;}
.sparkle-particle:nth-child(2) { left: 38vw; top: 7vh; width: 13px; height: 13px; background: radial-gradient(circle, #fffde4, #ffdd86 44%, transparent 80%); animation-duration: 2.6s; animation-delay: 0.4s;}
.sparkle-particle:nth-child(3) { left: 68vw; top: 16vh; width: 22px; height: 22px; background: radial-gradient(circle, #fff3b0, #ffc107 50%, transparent 85%); animation-duration: 3.9s; animation-delay: 0.2s;}
.sparkle-particle:nth-child(4) { left: 81vw; top: 6vh; width: 12px; height: 12px; background: radial-gradient(circle, #ffe9ba 40%, #ffc107 80%, transparent 100%); animation-duration: 2.8s; animation-delay: 1.3s; }
.sparkle-particle:nth-child(5) { left: 27vw; top: 23vh; width: 9px; height: 9px; background: radial-gradient(circle, #fff3b0 60%, #ffd34d 100%, transparent 120%); animation-duration: 3.1s; animation-delay: 0.7s; }
